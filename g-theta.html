<div id="gtheta-viz">
  <h3 id="gt-title">结附近的局部纤维</h3>
  <div class="viz-controls">
    <label class="form-label">模型
      <select class="form-select" id="gt-model"><option value="local">平滑局部纤维</option><option value="raw">原直纹片 · 对照</option></select>
    </label>
    <label class="form-label">视图
      <select class="form-select" id="gt-view"><option value="torus">闭合 · 三叶结</option><option value="cover">展开 · 万有覆盖</option></select>
    </label>
    <div class="viz-row">
      <label class="form-check"><input id="gt-fill" class="form-check-input" type="checkbox" checked><span class="form-check-label">曲面</span></label>
      <label class="form-check"><input id="gt-rules" class="form-check-input" type="checkbox" checked><span class="form-check-label">直纹线</span></label>
      <label class="form-check"><input id="gt-knot" class="form-check-input" type="checkbox" checked><span class="form-check-label">结 K</span></label>
    </div>
  </div>
  <div class="gt-stage"><canvas id="gt-canvas" role="img" aria-label="结上的粉色固定点 p，及位于曲面切平面内、垂直于结切线的蓝色向量；拖动旋转视角，滚轮缩放。"></canvas><div class="gt-normal"><span class="text-small">p 的法平面</span><svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="沿结的切线观察蓝色向量的方向"><circle cx="60" cy="60" r="44" fill="none" stroke="#9caaa5" stroke-width="1"/><line x1="60" y1="60" x2="104" y2="60" stroke="#727e79" stroke-dasharray="3 4"/><g id="gt-normal-arrow"><line x1="60" y1="60" x2="98" y2="60" stroke="#36a4ff" stroke-width="4"/><path d="M 91 55 L 100 60 L 91 65" fill="none" stroke="#36a4ff" stroke-width="4" stroke-linejoin="round"/></g><circle cx="60" cy="60" r="5" fill="#ff76b2"/></svg></div><div id="gt-error" role="alert" hidden></div></div>
  <div class="gt-caption text-small"><span id="gt-caption">管状邻域内 · 粉点固定 · 内向单位切向量</span><span>拖动旋转 · 滚轮缩放</span></div>
  <div class="gt-angle"><label for="gt-theta">θ</label><output id="gt-value" class="tabular-nums">0</output><span id="gt-motion" class="text-small tabular-nums">平移 0 · 转角 0</span></div>
  <input id="gt-theta" class="form-range" type="range" min="0" max="6.283185307179586" step="0.001" value="0" aria-label="螺旋运动参数 θ">
  <div class="gt-bottom"><button id="gt-play" class="btn btn-primary" type="button">播放</button><span class="text-small">0 → 2π</span><span id="gt-status" class="sr-only" aria-live="polite"></span></div>
</div>
<style>
#gtheta-viz .gt-stage{position:relative;width:100%;height:440px;margin-top:12px;background:#000;overflow:hidden}
#gtheta-viz canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#gtheta-viz canvas:active{cursor:grabbing}
#gtheta-viz .gt-caption{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin:8px 0 16px;color:var(--muted-foreground)}
#gtheta-viz .gt-angle{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
#gtheta-viz #gt-motion{margin-left:auto;color:var(--muted-foreground)}
#gtheta-viz .gt-bottom{display:flex;align-items:center;gap:12px;margin-top:6px}
#gtheta-viz #gt-error{position:absolute;inset:24px;color:#fff}
#gtheta-viz .gt-normal{position:absolute;right:10px;bottom:6px;display:flex;flex-direction:column;align-items:center;color:#d8e0dc;background:#000;pointer-events:none}
#gtheta-viz .gt-normal svg{display:block}
@media(max-width:480px){#gtheta-viz .gt-stage{height:340px}#gtheta-viz #gt-motion{margin-left:0}}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{
  const root=document.getElementById('gtheta-viz');
  const $=s=>root.querySelector(s), canvas=$('#gt-canvas');
  try {
    if(!window.THREE) throw Error('三维组件未能加载，请重新打开此可视化。');
    const T=window.THREE, PI=Math.PI, TAU=2*PI, A=TAU/3, R=2.25;
    const state={theta:0,view:'cover',model:'local',fill:true,rules:true,knot:true};
    let playing=false,last=0,dirty=true,yaw=-PI/2,elevation=.26,zoom=1;
    const fixedX=.8*A, beta=1.5*fixedX;
    const fixedPoint=[fixedX,Math.sin(beta),Math.cos(beta)];
    const helixSpeed=Math.sqrt(1+2.25),collarWidth=.62,arcHalfWidth=.7;
    const n0=new T.Vector3(0,Math.sin(beta),Math.cos(beta));
    const b0=new T.Vector3(1.5,-Math.cos(beta),Math.sin(beta)).divideScalar(helixSpeed);
    const originalInward=new T.Vector3(A-2*fixedX,-2*Math.sin(beta),0);
    const phase0=Math.atan2(originalInward.dot(b0),originalInward.dot(n0));
    let currentVector=[0,0,0],currentCell=0;
    const scene=new T.Scene();scene.background=new T.Color(0x000000);
    const renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:false});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    renderer.outputColorSpace=T.SRGBColorSpace;
    const camera=new T.PerspectiveCamera(36,1,.05,80);camera.up.set(0,0,1);
    scene.add(new T.AmbientLight(0xffffff,1.1));
    const light=new T.DirectionalLight(0xffffff,2.5);light.position.set(-3,-5,8);scene.add(light);
    const fillMat=new T.MeshPhongMaterial({color:0x31e864,side:T.DoubleSide,transparent:true,opacity:.25,depthWrite:false,shininess:45});
    const knotMat=new T.MeshPhongMaterial({color:0x00ad12,emissive:0x002b03,shininess:50});
    const ruleMat=new T.LineBasicMaterial({color:0x76ff92,transparent:true,opacity:.66});
    const fixed=new T.Group(), moving=new T.Group(), rules=new T.Group();scene.add(fixed,moving,rules);
    const tracked=[];
    const marker=new T.Mesh(new T.SphereGeometry(.085,20,14),new T.MeshBasicMaterial({color:0xff76b2}));scene.add(marker);
    const arrow=new T.Group(),blueMat=new T.MeshBasicMaterial({color:0x36a4ff});
    const shaft=new T.Mesh(new T.CylinderGeometry(.022,.022,.57,12),blueMat);shaft.position.y=.285;
    const tip=new T.Mesh(new T.ConeGeometry(.075,.18,16),blueMat);tip.position.y=.66;
    arrow.add(shaft,tip);scene.add(arrow);
    arrow.scale.setScalar(.6);
    // One diagram-based patch. Opposite helices are paired:
    // F(u,r)=r h_+(u)+(1-r) h_-(A-u), 0<=u<=A, 0<=r<=1.
    function patch(u,r){const t=2*r-1;return [A/2+t*(u-A/2),t*Math.sin(1.5*u),Math.cos(1.5*u)];}
    function screw(p,theta){const c=Math.cos(theta/2),s=Math.sin(theta/2);return [p[0]+theta/3,p[1]*c+p[2]*s,-p[1]*s+p[2]*c];}
    function quotient(p){return [(R+p[1])*Math.cos(p[0]),(R+p[1])*Math.sin(p[0]),p[2]];}
    function world(p){return state.view==='torus'?quotient(p):[p[0],p[1],p[2]];}
    function rotateVector(v,theta){const c=Math.cos(theta/2),s=Math.sin(theta/2);return [v[0],v[1]*c+v[2]*s,-v[1]*s+v[2]*c];}
    function pushVector(v){
      if(state.view==='cover')return new T.Vector3(...v);
      const c=Math.cos(fixedX),s=Math.sin(fixedX),rho=R+fixedPoint[1];
      return new T.Vector3(-rho*s*v[0]+c*v[1],rho*c*v[0]+s*v[1],v[2]);
    }
    // A genuine local page in a tubular chart. r >= 0 selects the inward
    // ray; both the surface and its derivative use the same direction.
    // This is a local replacement, not a global gluing to Rolfsen's disks.
    function localDirection(s,theta){
      const betaS=1.5*s,c=Math.cos(phase0-theta),d=Math.sin(phase0-theta);
      return [d*1.5/helixSpeed,c*Math.sin(betaS)-d*Math.cos(betaS)/helixSpeed,c*Math.cos(betaS)+d*Math.sin(betaS)/helixSpeed];
    }
    function localPoint(s,r){
      const v=localDirection(s,state.theta);
      return world([s+r*v[0],Math.sin(1.5*s)+r*v[1],Math.cos(1.5*s)+r*v[2]]);
    }
    function updateVector(){
      const surfaceDirection=pushVector(localDirection(fixedX,state.theta));
      const tangent=pushVector([1,1.5*Math.cos(beta),-1.5*Math.sin(beta)]).normalize();
      const v=surfaceDirection.clone().addScaledVector(tangent,-surfaceDirection.dot(tangent)).normalize();
      currentVector=v.toArray();
      const origin=new T.Vector3(...world(fixedPoint));marker.position.copy(origin);arrow.position.copy(origin);
      arrow.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),v);
      const e1=pushVector([0,Math.sin(beta),Math.cos(beta)]).normalize();
      const e2=new T.Vector3().crossVectors(tangent,e1).normalize();
      const angle=-Math.atan2(v.dot(e2),v.dot(e1))*180/PI;
      $('#gt-normal-arrow').setAttribute('transform','rotate('+angle+' 60 60)');
      const initial=pushVector(localDirection(fixedX,0));initial.addScaledVector(tangent,-initial.dot(tangent)).normalize();
      const initialAngle=Math.atan2(initial.dot(e2),initial.dot(e1));
      const orientation=Math.sign(pushVector(b0.toArray()).dot(e2));
      let turn=((initialAngle+angle*PI/180)*orientation+2*TAU)%TAU;
      if(state.theta>TAU-1e-7)turn=TAU;
      let readout=$('#gt-turn');if(!readout){readout=document.createElement('span');readout.id='gt-turn';readout.className='text-small tabular-nums';$('.gt-normal').appendChild(readout);}
      readout.textContent='累计转角 '+Math.round(turn*180/PI)+'°';
      arrow.visible=state.model==='local';
      $('.gt-normal').hidden=state.model!=='local';
      $('.gt-normal').style.display=state.model==='local'?'flex':'none';
    }
    function track(object){tracked.push({object,base:object.geometry.attributes.position.array.slice()});return object;}
    function curveTube(points,radius,mat,segments){
      const curve=new T.CatmullRomCurve3(points.map(p=>new T.Vector3(...p)));
      return new T.Mesh(new T.TubeGeometry(curve,segments,radius,7,false),mat);
    }
    const positions=[],indices=[],NU=100,NR=32;
    for(let i=0;i<=NU;i++) for(let j=0;j<=NR;j++) positions.push(...patch(A*i/NU,j/NR));
    for(let i=0;i<NU;i++) for(let j=0;j<NR;j++){const k=i*(NR+1)+j;indices.push(k,k+1,k+NR+1,k+1,k+NR+2,k+NR+1);}
    const geometry=new T.BufferGeometry();geometry.setAttribute('position',new T.Float32BufferAttribute(positions,3));geometry.setIndex(indices);geometry.computeVertexNormals();
    const sheet=track(new T.Mesh(geometry,fillMat));moving.add(sheet);
    for(let i=1;i<23;i++){
      const points=Array.from({length:65},(_,j)=>patch(A*i/23,j/64)).flat();
      const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(points,3));
      rules.add(track(new T.Line(g,ruleMat)));
    }
    const collarGeometry=new T.BufferGeometry();
    collarGeometry.setAttribute('position',new T.Float32BufferAttribute(new Float32Array((NU+1)*(NR+1)*3),3));
    collarGeometry.setIndex(indices);
    const collar=new T.Mesh(collarGeometry,fillMat);scene.add(collar);
    const collarRules=new T.Group();scene.add(collarRules);
    for(let i=0;i<=20;i++){
      const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(new Float32Array(65*3),3));
      collarRules.add(new T.Line(g,ruleMat));
    }
    function updateCollar(){
      const a=collarGeometry.attributes.position;
      for(let i=0;i<=NU;i++)for(let j=0;j<=NR;j++){
        const p=localPoint(fixedX+arcHalfWidth*(2*i/NU-1),collarWidth*j/NR);
        a.setXYZ(i*(NR+1)+j,...p);
      }
      a.needsUpdate=true;collarGeometry.computeVertexNormals();collarGeometry.computeBoundingSphere();
      collarRules.children.forEach((line,i)=>{
        const a=line.geometry.attributes.position,s=fixedX+arcHalfWidth*(2*i/20-1);
        for(let j=0;j<=64;j++)a.setXYZ(j,...localPoint(s,collarWidth*j/64));
        a.needsUpdate=true;line.geometry.computeBoundingSphere();
      });
    }
    function clearGroup(group){while(group.children.length){const child=group.children[0];child.geometry.dispose();group.remove(child);}}
    function buildFixed(){
      clearGroup(fixed);
      if(state.view==='torus'){
        const pts=Array.from({length:721},(_,i)=>{const x=2*TAU*i/720;return quotient([x,Math.sin(1.5*x),Math.cos(1.5*x)]);});
        fixed.add(curveTube(pts,.05,knotMat,900));
      } else {
        for(const sign of [-1,1]){
          const pts=Array.from({length:401},(_,i)=>{const x=-.35+(TAU+.7)*i/400;return [x,sign*Math.sin(1.5*x),sign*Math.cos(1.5*x)];});
          fixed.add(curveTube(pts,.04,knotMat,500));
        }
      }
      fixed.visible=state.knot;
    }
    function piLabel(value){for(const [v,label] of [[0,'0'],[TAU,'2π'],[PI,'π'],[PI/2,'π/2'],[PI/3,'π/3'],[TAU/3,'2π/3']])if(Math.abs(value-v)<.004)return label;return (value/PI).toFixed(2)+'π';}
    function update(){
      // Display only the translated fundamental patch containing the fixed p.
      currentCell=Math.floor((fixedX-state.theta/3)/A);
      for(const {object,base} of tracked){
        const attr=object.geometry.attributes.position,arr=attr.array;
        for(let k=0;k<base.length;k+=3){const p=world(screw([base[k]+currentCell*A,base[k+1],base[k+2]],state.theta));arr[k]=p[0];arr[k+1]=p[1];arr[k+2]=p[2];}
        attr.needsUpdate=true;object.geometry.computeBoundingSphere();
        if(object.isMesh)object.geometry.computeVertexNormals();
      }
      const local=state.model==='local';
      moving.visible=!local;sheet.visible=state.fill;rules.visible=!local&&state.rules;fixed.visible=state.knot;
      collar.visible=local&&state.fill;collarRules.visible=local&&state.rules;
      if(local)updateCollar();
      updateVector();
      $('#gt-theta').value=state.theta;$('#gt-value').textContent=piLabel(state.theta);
      $('#gt-theta').setAttribute('aria-valuetext',piLabel(state.theta));
      $('#gt-motion').textContent=local?'局部纤维相位 '+piLabel(state.theta):'平移 '+piLabel(state.theta/3)+' · 转角 '+piLabel(state.theta/2);
      $('#gt-title').textContent=local?'结附近的局部纤维':'原始 Gθ · 一个直纹片';
      $('#gt-caption').textContent=local?'管状邻域内 · 粉点固定 · 内向单位切向量':'原始直纹片 · 未补全、未平滑';
      dirty=true;
    }
    function cameraUpdate(){
      const center=new T.Vector3(state.view==='torus'?0:PI,0,0);
      const aspect=camera.aspect,dist=(state.view==='torus'?12:11)*zoom*Math.max(1,.95/aspect);
      camera.position.set(center.x+dist*Math.cos(elevation)*Math.cos(yaw),center.y+dist*Math.cos(elevation)*Math.sin(yaw),center.z+dist*Math.sin(elevation));
      camera.lookAt(center);dirty=true;
    }
    function save(){
      if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{theta:state.theta,thetaOverPi:state.theta/PI,view:state.view,model:state.model,fixedPointX:fixedX,tangentVector:state.model==='local'?currentVector:null,patch:state.model==='local'?'smooth tubular local page; not a global Rolfsen reconstruction':'raw ruled patch; no smooth normal framing claimed'},privateContent:{...state,yaw,elevation,zoom}}).catch(()=>{});
    }
    function stop(){playing=false;$('#gt-play').textContent='播放';}
    function apply(saved){
      const s=saved?.privateContent;if(!s)return;
      if(Number.isFinite(s.theta))state.theta=Math.max(0,Math.min(TAU,s.theta));
      if(s.view==='torus'||s.view==='cover')state.view=s.view;
      if(s.model==='raw'||s.model==='local')state.model=s.model;
      for(const key of ['fill','rules','knot'])if(typeof s[key]==='boolean')state[key]=s[key];
      if(Number.isFinite(s.yaw))yaw=s.yaw;
      if(Number.isFinite(s.elevation))elevation=Math.max(-1.4,Math.min(1.4,s.elevation));
      if(Number.isFinite(s.zoom))zoom=Math.max(.6,Math.min(2,s.zoom));
      $('#gt-view').value=state.view;$('#gt-model').value=state.model;for(const key of ['fill','rules','knot'])$('#gt-'+key).checked=state[key];
      stop();buildFixed();update();cameraUpdate();
    }
    $('#gt-theta').addEventListener('input',()=>{stop();state.theta=Number($('#gt-theta').value);update();});
    $('#gt-theta').addEventListener('change',()=>{save();$('#gt-status').textContent='θ = '+piLabel(state.theta);});
    $('#gt-play').addEventListener('click',()=>{
      if(playing){stop();save();return;}
      if(state.theta>=TAU-.001)state.theta=0;
      playing=true;last=performance.now();$('#gt-play').textContent='暂停';
    });
    $('#gt-view').addEventListener('change',()=>{state.view=$('#gt-view').value;yaw=state.view==='torus'?-1.03:-1.57;elevation=state.view==='torus'?.58:.26;zoom=1;buildFixed();update();cameraUpdate();save();});
    $('#gt-model').addEventListener('change',()=>{state.model=$('#gt-model').value;update();save();});
    for(const key of ['fill','rules','knot'])$('#gt-'+key).addEventListener('change',()=>{state[key]=$('#gt-'+key).checked;update();save();});
    let drag=null;
    canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});
    canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-drag.x)*.008;elevation=Math.max(-1.4,Math.min(1.4,elevation+(e.clientY-drag.y)*.008));drag={x:e.clientX,y:e.clientY};cameraUpdate();});
    canvas.addEventListener('pointerup',()=>{drag=null;save();});canvas.addEventListener('pointercancel',()=>{drag=null;});
    canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.6,Math.min(2,zoom*Math.exp(e.deltaY*.001)));cameraUpdate();save();},{passive:false});
    const observer=new ResizeObserver(()=>{const w=canvas.parentElement.clientWidth,h=canvas.parentElement.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();cameraUpdate();});observer.observe(canvas.parentElement);
    window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)apply(event.detail.globals.widgetState);});
    $('#gt-view').value=state.view;buildFixed();update();apply(window.openai?.widgetState);cameraUpdate();
    function animate(now){
      if(!root.isConnected){observer.disconnect();renderer.dispose();return;}
      requestAnimationFrame(animate);
      if(playing){const dt=Math.min((now-last)/1000,.08);last=now;state.theta=Math.min(TAU,state.theta+dt*TAU/18);update();if(state.theta===TAU){stop();save();$('#gt-status').textContent='动画完成：θ = 2π';}}
      if(dirty){renderer.render(scene,camera);dirty=false;}
    }
    requestAnimationFrame(animate);
  } catch(error){$('#gt-error').hidden=false;$('#gt-error').textContent=error.message;}
})();
</script>
