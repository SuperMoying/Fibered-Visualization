<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fibered Visualization · Gθ</title>
<style>
:root{--muted-foreground:#6b7280}
body{margin:0;padding:24px;max-width:960px;margin-inline:auto;font-family:system-ui,"Segoe UI","Microsoft YaHei",sans-serif;color:#111;background:#fafafa}
h3{margin:0 0 12px}
.viz-controls{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
.viz-row{display:flex;gap:14px;flex-wrap:wrap}
.form-label{display:flex;flex-direction:column;gap:4px;font-size:14px}
.form-select{padding:4px 8px;font:inherit}
.form-check{display:flex;align-items:center;gap:4px;font-size:14px}
.form-range{accent-color:#36a4ff}
#gt-theta{width:100%}
.btn{padding:6px 16px;border:0;border-radius:6px;font:inherit;cursor:pointer}
.btn-primary{background:#36a4ff;color:#fff}
.text-small{font-size:12px}
.tabular-nums{font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="gtheta-viz">
  <h3 id="gt-title">结附近的局部纤维</h3>
  <div class="viz-controls">
    <label class="form-label">模型
      <select class="form-select" id="gt-model"><option value="local">平滑局部纤维</option><option value="raw">原直纹片 · 对照</option></select>
    </label>
    <label class="form-label">视图
      <select class="form-select" id="gt-view"><option value="cover-1">① 单片 · 展开（万有覆盖）</option><option value="torus-1">② 单片 · 闭合（三叶结）</option><option value="cover-3">③ 三片 · 展开（万有覆盖）</option><option value="torus-3">④ 三片 · 闭合（三叶结 + 圆盘）</option></select>
    </label>
    <div class="viz-row">
      <label class="form-check"><input id="gt-fill" class="form-check-input" type="checkbox" checked><span class="form-check-label">曲面</span></label>
      <label class="form-check"><input id="gt-rules" class="form-check-input" type="checkbox" checked><span class="form-check-label">直纹线</span></label>
      <label class="form-check"><input id="gt-knot" class="form-check-input" type="checkbox" checked><span class="form-check-label">结 K</span></label>
      <label class="form-check"><input id="gt-family" class="form-check-input" type="checkbox"><span class="form-check-label">多面叠加</span></label>
      <label class="form-check"><input id="gt-shadow" class="form-check-input" type="checkbox" checked><span class="form-check-label">光照阴影</span></label>
      <label class="form-check"><input id="gt-disks" class="form-check-input" type="checkbox" checked><span class="form-check-label">圆盘</span></label>
    </div>
  </div>
  <div class="gt-opacity-row"><label for="gt-opacity">不透明度 <output id="gt-opacity-value" class="tabular-nums">85%</output></label><input id="gt-opacity" class="form-range" type="range" min="0.03" max="1" step="0.01" value="0.85"><span class="text-small" id="gt-spec-lo">θ：0</span><span class="gt-spectrum" aria-label="曲面随 θ 从红色变为紫色"></span><span class="text-small" id="gt-spec-hi">2π</span></div>
  <div class="gt-opacity-row"><label for="gt-fold">拼合 λ <output id="gt-fold-value" class="tabular-nums">0.00</output></label><input id="gt-fold" class="form-range" type="range" min="0" max="1" step="0.001" value="0" aria-label="展开到闭合的拼合参数 λ"><span class="text-small">展开 0 → 闭合 1 · 切换视图自动播放</span></div>
  <div class="gt-stage"><canvas id="gt-canvas" role="img" aria-label="结上的粉色固定点 p，及位于曲面切平面内、垂直于结切线的蓝色向量；拖动旋转视角，滚轮缩放。"></canvas><div class="gt-normal"><span class="text-small">p 的法平面</span><svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="沿结的切线观察蓝色向量的方向"><circle cx="60" cy="60" r="44" fill="none" stroke="#9caaa5" stroke-width="1"/><line x1="60" y1="60" x2="104" y2="60" stroke="#727e79" stroke-dasharray="3 4"/><g id="gt-normal-arrow"><line x1="60" y1="60" x2="98" y2="60" stroke="#36a4ff" stroke-width="4"/><path d="M 91 55 L 100 60 L 91 65" fill="none" stroke="#36a4ff" stroke-width="4" stroke-linejoin="round"/></g><circle cx="60" cy="60" r="5" fill="#ff76b2"/></svg></div><div id="gt-error" role="alert" hidden></div></div>
  <div class="gt-caption text-small"><span id="gt-caption">管状邻域内 · 粉点固定 · 内向单位切向量</span><span>拖动旋转 · 滚轮缩放</span></div>
  <div class="gt-angle"><span>θ</span><output id="gt-value" class="tabular-nums">0</output><span id="gt-motion" class="text-small tabular-nums">平移 0 · 转角 0</span></div>
  <div class="gt-bottom"><button id="gt-play" class="btn btn-primary" type="button">播放</button><button id="gt-pause" class="btn btn-secondary" type="button">暂停</button><button id="gt-reset" class="btn btn-secondary" type="button">重置</button><span class="text-small">0 → 12π 循环 · 平移两整圈，严丝合缝</span><span id="gt-status" class="sr-only" aria-live="polite"></span></div>
</div>
<style>
#gtheta-viz .gt-stage{position:relative;width:100%;height:440px;margin-top:12px;background:#000;overflow:hidden}
#gtheta-viz canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#gtheta-viz canvas:active{cursor:grabbing}
#gtheta-viz .gt-caption{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin:8px 0 16px;color:var(--muted-foreground)}
#gtheta-viz .gt-angle{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
#gtheta-viz #gt-motion{margin-left:auto;color:var(--muted-foreground)}
#gtheta-viz .gt-bottom{display:flex;align-items:center;gap:12px;margin-top:6px;flex-wrap:wrap}
#gtheta-viz .btn-secondary{background:#3a4248;color:#fff}
#gtheta-viz #gt-error{position:absolute;inset:24px;color:#fff}
#gtheta-viz .gt-normal{position:absolute;right:10px;bottom:6px;display:flex;flex-direction:column;align-items:center;color:#d8e0dc;background:#000;pointer-events:none}
#gtheta-viz .gt-normal svg{display:block}
#gtheta-viz .gt-opacity-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
#gtheta-viz .gt-opacity-row input{flex:1;min-width:100px;max-width:200px}
#gtheta-viz .gt-spectrum{width:110px;height:8px;background:linear-gradient(90deg,#ff3030,#ffbb30,#c8ff30,#30ff87,#30dbff,#4965ff,#b030ff)}
@media(max-width:480px){#gtheta-viz .gt-stage{height:340px}#gtheta-viz #gt-motion{margin-left:0}}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{
  const root=document.getElementById('gtheta-viz');
  const $=s=>root.querySelector(s), canvas=$('#gt-canvas');
  try {
    if(!window.THREE) throw Error('三维组件未能加载，请重新打开此可视化。');
    const T=window.THREE, PI=Math.PI, TAU=2*PI, A=TAU/3, R=2.25, THETA_MAX=12*PI;   // full period: translation 4π ≡ 0 and twist 6π ≡ 0, so the strips come back exactly
    const state={theta:0,view:'cover',count:1,fold:0,model:'raw',fill:true,rules:true,knot:true,family:false,shadow:true,disks:true,opacity:.85};
    let playing=false,last=0,dirty=true,yaw=-PI/2,elevation=.26,zoom=1,foldAnim=null,builtFold=-1;
    const CAM={cover:{yaw:-1.57,elevation:.26,dist:11},torus:{yaw:-1.03,elevation:.58,dist:12}};
    const fixedX=.8*A, beta=1.5*fixedX;
    const fixedPoint=[fixedX,Math.sin(beta),Math.cos(beta)];
    const helixSpeed=Math.sqrt(1+2.25),collarWidth=.62,arcHalfWidth=.7;
    const n0=new T.Vector3(0,Math.sin(beta),Math.cos(beta));
    const b0=new T.Vector3(1.5,-Math.cos(beta),Math.sin(beta)).divideScalar(helixSpeed);
    const originalInward=new T.Vector3(A-2*fixedX,-2*Math.sin(beta),0);
    const phase0=Math.atan2(originalInward.dot(b0),originalInward.dot(n0));
    let currentVector=[0,0,0],currentCell=0;
    const scene=new T.Scene();scene.background=new T.Color(0x000000);
    const renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:false});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
    renderer.outputColorSpace=T.SRGBColorSpace;
    const camera=new T.PerspectiveCamera(36,1,.05,80);camera.up.set(0,0,1);
    scene.add(new T.AmbientLight(0xffffff,.45));
    scene.add(new T.HemisphereLight(0xdfe8ff,0x202020,.5));
    // Key light with shadows; shadow camera covers both views (cover spans x in [-1, 8]).
    const light=new T.DirectionalLight(0xffffff,2.6);light.position.set(-4,-7,10);light.castShadow=true;
    light.shadow.mapSize.set(2048,2048);light.shadow.bias=-.0004;light.shadow.normalBias=.02;
    Object.assign(light.shadow.camera,{left:-13,right:13,top:13,bottom:-13,near:1,far:40});
    light.target.position.set(2,0,0);scene.add(light,light.target);
    const fill=new T.DirectionalLight(0xffffff,.7);fill.position.set(6,5,3);scene.add(fill);
    // Dark ground plane below the knot that catches the shadows of the knot and the sheet.
    const ground=new T.Mesh(new T.PlaneGeometry(80,80),new T.MeshStandardMaterial({color:0x0e1214,roughness:1,metalness:0}));
    ground.position.z=-3.6;ground.receiveShadow=true;scene.add(ground);
    const fillMat=new T.MeshPhongMaterial({color:0xff3030,side:T.DoubleSide,transparent:true,opacity:state.opacity,depthWrite:false,shininess:20,forceSinglePass:true});
    const knotMat=new T.MeshPhongMaterial({color:0x00ad12,emissive:0x002b03,shininess:50});
    const ruleMat=new T.LineBasicMaterial({color:0xff6868,transparent:true,opacity:.4,depthWrite:false});
    const fixed=new T.Group(), moving=new T.Group(), rules=new T.Group();scene.add(fixed,moving,rules);
    const tracked=[];
    const marker=new T.Mesh(new T.SphereGeometry(.085,20,14),new T.MeshBasicMaterial({color:0xff76b2}));marker.castShadow=true;scene.add(marker);
    const arrow=new T.Group(),blueMat=new T.MeshBasicMaterial({color:0x36a4ff});
    const shaft=new T.Mesh(new T.CylinderGeometry(.022,.022,.57,12),blueMat);shaft.position.y=.285;
    const tip=new T.Mesh(new T.ConeGeometry(.075,.18,16),blueMat);tip.position.y=.66;
    arrow.add(shaft,tip);scene.add(arrow);
    arrow.scale.setScalar(.6);
    // One diagram-based patch. Opposite helices are paired:
    // F(u,r)=r h_+(u)+(1-r) h_-(A-u), 0<=u<=A, 0<=r<=1.
    function patch(u,r){const t=2*r-1;return [A/2+t*(u-A/2),t*Math.sin(1.5*u),Math.cos(1.5*u)];}
    function screw(p,theta){const c=Math.cos(theta/2),s=Math.sin(theta/2);return [p[0]+theta/3,p[1]*c+p[2]*s,-p[1]*s+p[2]*c];}
    // Bending map between the universal cover (λ=0, identity) and the solid torus (λ=1).
    // The straight axis is bent into an arc of radius ρ=L/λ whose length scale L goes 1→R,
    // hinged at x=PIVOT, which stays still. At λ=1 this is exactly
    //   Q(x,y,z) = ((R+y)cos x, -(R+y)sin x, z)   (orientation-preserving quotient).
    const PIVOT=1.5*PI;
    function fold(p,l){
      if(l<1e-4)return [p[0],p[1],p[2]];
      const L=1+l*(R-1),rho=L/l,phi=PIVOT+l*(p[0]-PIVOT),rad=rho+p[1];
      const cx=(1-l)*PIVOT,cy=R-rho-(1-l)*R;
      return [cx+rad*Math.cos(phi),cy-rad*Math.sin(phi),p[2]];
    }
    function world(p){return fold(p,state.fold);}
    function rotateVector(v,theta){const c=Math.cos(theta/2),s=Math.sin(theta/2);return [v[0],v[1]*c+v[2]*s,-v[1]*s+v[2]*c];}
    // Push a tangent vector at the fixed point through the current bending map (central difference).
    function pushVector(v){
      const e=1e-4,q=fixedPoint;
      const a=world([q[0]+e*v[0],q[1]+e*v[1],q[2]+e*v[2]]),b=world([q[0]-e*v[0],q[1]-e*v[1],q[2]-e*v[2]]);
      return new T.Vector3((a[0]-b[0])/(2*e),(a[1]-b[1])/(2*e),(a[2]-b[2])/(2*e));
    }
    // A genuine local page in a tubular chart. r >= 0 selects the inward
    // ray; both the surface and its derivative use the same direction.
    // This is a local replacement, not a global gluing to Rolfsen's disks.
    function localDirection(s,theta){
      const betaS=1.5*s,c=Math.cos(phase0-theta),d=Math.sin(phase0-theta);
      return [d*1.5/helixSpeed,c*Math.sin(betaS)-d*Math.cos(betaS)/helixSpeed,c*Math.cos(betaS)+d*Math.sin(betaS)/helixSpeed];
    }
    function localPoint(s,r,theta=state.theta){
      const v=localDirection(s,theta);
      return world([s+r*v[0],Math.sin(1.5*s)+r*v[1],Math.cos(1.5*s)+r*v[2]]);
    }
    function updateVector(){
      const surfaceDirection=pushVector(localDirection(fixedX,state.theta));
      const tangent=pushVector([1,1.5*Math.cos(beta),-1.5*Math.sin(beta)]).normalize();
      const v=surfaceDirection.clone().addScaledVector(tangent,-surfaceDirection.dot(tangent)).normalize();
      currentVector=v.toArray();
      const origin=new T.Vector3(...world(fixedPoint));marker.position.copy(origin);arrow.position.copy(origin);
      arrow.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),v);
      const e1=pushVector([0,Math.sin(beta),Math.cos(beta)]).normalize();
      const e2=new T.Vector3().crossVectors(tangent,e1).normalize();
      const angle=-Math.atan2(v.dot(e2),v.dot(e1))*180/PI;
      $('#gt-normal-arrow').setAttribute('transform','rotate('+angle+' 60 60)');
      const initial=pushVector(localDirection(fixedX,0));initial.addScaledVector(tangent,-initial.dot(tangent)).normalize();
      const initialAngle=Math.atan2(initial.dot(e2),initial.dot(e1));
      const orientation=Math.sign(pushVector(b0.toArray()).dot(e2));
      let turn=((initialAngle+angle*PI/180)*orientation+2*TAU)%TAU;
      if(Math.abs(state.theta-TAU)<1e-7)turn=TAU;
      let readout=$('#gt-turn');if(!readout){readout=document.createElement('span');readout.id='gt-turn';readout.className='text-small tabular-nums';$('.gt-normal').appendChild(readout);}
      readout.textContent='累计转角 '+Math.round(turn*180/PI)+'°';
      arrow.visible=state.model==='local';
      $('.gt-normal').hidden=state.model!=='local';
      $('.gt-normal').style.display=state.model==='local'?'flex':'none';
    }
    function track(object){tracked.push({object,base:object.geometry.attributes.position.array.slice()});return object;}
    function curveTube(points,radius,mat,segments){
      const curve=new T.CatmullRomCurve3(points.map(p=>new T.Vector3(...p)));
      const m=new T.Mesh(new T.TubeGeometry(curve,segments,radius,7,false),mat);m.castShadow=m.receiveShadow=true;return m;
    }
    const positions=[],indices=[],NU=100,NR=32;
    for(let i=0;i<=NU;i++) for(let j=0;j<=NR;j++) positions.push(...patch(A*i/NU,j/NR));
    for(let i=0;i<NU;i++) for(let j=0;j<NR;j++){const k=i*(NR+1)+j;indices.push(k,k+1,k+NR+1,k+1,k+NR+2,k+NR+1);}
    const geometry=new T.BufferGeometry();geometry.setAttribute('position',new T.Float32BufferAttribute(positions,3));geometry.setIndex(indices);geometry.computeVertexNormals();
    // One ruled sheet that travels along K. It is cut into `strips` thin ruled pieces
    // (the gaps between the rule lines); each piece keeps its own rainbow colour, red to violet along u.
    const strips=23, stripSub=4, sheetPos=[], sheetCol=[];
    function stripColor(k){return new T.Color().setHSL(.78*k/(strips-1),1,.5);}
    for(let k=0;k<strips;k++){
      const color=stripColor(k);
      for(let a=0;a<stripSub;a++)for(let j=0;j<NR;j++){
        const u0=A*(k*stripSub+a)/(strips*stripSub),u1=A*(k*stripSub+a+1)/(strips*stripSub);
        const p00=patch(u0,j/NR),p01=patch(u0,(j+1)/NR),p10=patch(u1,j/NR),p11=patch(u1,(j+1)/NR);
        sheetPos.push(...p00,...p01,...p10,...p01,...p11,...p10);
        for(let v=0;v<6;v++)sheetCol.push(color.r,color.g,color.b);
      }
    }
    const sheetGeometry=new T.BufferGeometry();
    sheetGeometry.setAttribute('position',new T.Float32BufferAttribute(sheetPos,3));
    sheetGeometry.setAttribute('color',new T.Float32BufferAttribute(sheetCol,3));
    sheetGeometry.computeVertexNormals();
    const sheetMat=new T.MeshStandardMaterial({color:0xffffff,vertexColors:true,side:T.DoubleSide,transparent:true,opacity:state.opacity,depthWrite:true,roughness:.55,metalness:0,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
    // Three sheets, one per fundamental cell (x offset c·A); together they tile the whole knot.
    const cells=3, sheets=[];
    for(let c=0;c<cells;c++){
      const g=c===0?sheetGeometry:sheetGeometry.clone();
      if(c>0){const a=g.attributes.position;for(let i=0;i<a.count;i++)a.setX(i,a.getX(i)+c*A);}
      const m=track(new T.Mesh(g,sheetMat));m.userData.group=3;m.userData.cell=c;m.castShadow=m.receiveShadow=true;moving.add(m);sheets.push(m);
    }
    const ruleMats=[];
    for(let i=1;i<strips;i++){
      const rm=ruleMat.clone();rm.color.copy(stripColor(i-.5));ruleMats.push(rm);
      for(let c=0;c<cells;c++){
        const points=[];
        for(let j=0;j<64;j++){const p=patch(A*i/strips,j/64),q=patch(A*i/strips,(j+1)/64);points.push(p[0]+c*A,p[1],p[2],q[0]+c*A,q[1],q[2]);}
        const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(points,3));
        const line=track(new T.LineSegments(g,rm));line.userData.group=2;line.userData.cell=c;rules.add(line);
      }
    }
    // Rolfsen's two disks. At λ=1 the red edges (u=0) of the three sheets tile the longitude
    // L_φ of the torus at meridional angle φ=θ/2, and the violet edges (u=A) tile L_{φ+π}.
    // Each longitude bounds a meridian disk of the outer solid torus: the cap of the sphere
    // through L_φ that meets the torus orthogonally. At the inner equator that cap is the flat
    // disk in the hole; at the outer equator it flattens into the plane z=0 and runs off to
    // infinity, so the disk is drawn fading out with arc length from its boundary circle.
    const DISK_S=40, DISK_A=96, DISK_SMAX=6.5;
    function diskTexture(tint){
      const c=document.createElement('canvas');c.width=512;c.height=256;const ctx=c.getContext('2d');
      const img=ctx.createImageData(512,256),d=img.data;
      for(let y=0;y<256;y++)for(let x=0;x<512;x++){
        const i=4*(y*512+x),u=x/511,grid=(x%32===0)||(y%8===0),base=grid?.62:1;
        const fade=u<.3?1:Math.max(0,1-(u-.3)/.7);
        d[i]=tint[0]*base;d[i+1]=tint[1]*base;d[i+2]=tint[2]*base;d[i+3]=255*fade*fade;
      }
      ctx.putImageData(img,0,0);
      const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;t.wrapS=T.ClampToEdgeWrapping;t.wrapT=T.RepeatWrapping;return t;
    }
    function makeDisk(tint){
      const n=(DISK_S+1)*(DISK_A+1),g=new T.BufferGeometry();
      g.setAttribute('position',new T.BufferAttribute(new Float32Array(n*3),3));
      g.setAttribute('uv',new T.BufferAttribute(new Float32Array(n*2),2));
      const idx=[];
      for(let i=0;i<DISK_S;i++)for(let j=0;j<DISK_A;j++){const k=i*(DISK_A+1)+j;idx.push(k,k+1,k+DISK_A+1,k+1,k+DISK_A+2,k+DISK_A+1);}
      g.setIndex(idx);
      const mat=new T.MeshStandardMaterial({map:diskTexture(tint),color:0xffffff,side:T.DoubleSide,transparent:true,opacity:.55,depthWrite:false,roughness:.85,metalness:0});
      const mesh=new T.Mesh(g,mat);mesh.frustumCulled=false;scene.add(mesh);return mesh;
    }
    function makeRing(color){
      const mesh=new T.Mesh(new T.TorusGeometry(R,.028,8,160),new T.MeshBasicMaterial({color,transparent:true,opacity:1}));
      scene.add(mesh);return mesh;
    }
    const diskA=makeDisk([246,232,232]),diskB=makeDisk([232,232,246]);
    const ringA=makeRing(stripColor(0)),ringB=makeRing(stripColor(strips-1));
    function updateDisk(mesh,ring,phi){
      const sn=Math.sin(phi),zc=Math.cos(phi),rc=R+sn;
      let cs=Math.cos(phi);if(Math.abs(cs)<.02)cs=cs<0?-.02:.02;   // the exact equators give planes
      const m=(1+R*sn)/cs,rho=Math.hypot(rc,zc-m),sigma=cs>0?1:-1;
      const psiC=Math.atan2(rc,sigma*(zc-m)),len=Math.min(rho*psiC,DISK_SMAX);
      const pos=mesh.geometry.attributes.position,uv=mesh.geometry.attributes.uv;
      for(let i=0;i<=DISK_S;i++){
        const sArc=len*i/DISK_S,psi=psiC-sArc/rho,r=rho*Math.sin(psi),z=m+sigma*rho*Math.cos(psi);
        for(let j=0;j<=DISK_A;j++){
          const k=i*(DISK_A+1)+j,al=TAU*j/DISK_A;
          pos.setXYZ(k,r*Math.cos(al),-r*Math.sin(al),z);uv.setXY(k,sArc/DISK_SMAX,j/DISK_A);
        }
      }
      pos.needsUpdate=true;uv.needsUpdate=true;mesh.geometry.computeVertexNormals();mesh.geometry.computeBoundingSphere();
      ring.geometry.dispose();ring.geometry=new T.TorusGeometry(rc,.028,8,160);ring.position.z=zc;
    }
    const collarGeometry=new T.BufferGeometry();
    collarGeometry.setAttribute('position',new T.Float32BufferAttribute(new Float32Array((NU+1)*(NR+1)*3),3));
    collarGeometry.setIndex(indices);
    const collar=new T.Mesh(collarGeometry,fillMat);collar.castShadow=collar.receiveShadow=true;scene.add(collar);
    const collarRules=new T.Group();scene.add(collarRules);
    for(let i=0;i<=20;i++){
      const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(new Float32Array(65*3),3));
      collarRules.add(new T.Line(g,ruleMat));
    }
    function updateCollar(){
      const a=collarGeometry.attributes.position;
      for(let i=0;i<=NU;i++)for(let j=0;j<=NR;j++){
        const p=localPoint(fixedX+arcHalfWidth*(2*i/NU-1),collarWidth*j/NR);
        a.setXYZ(i*(NR+1)+j,...p);
      }
      a.needsUpdate=true;collarGeometry.computeVertexNormals();collarGeometry.computeBoundingSphere();
      collarRules.children.forEach((line,i)=>{
        const a=line.geometry.attributes.position,s=fixedX+arcHalfWidth*(2*i/20-1);
        for(let j=0;j<=64;j++)a.setXYZ(j,...localPoint(s,collarWidth*j/64));
        a.needsUpdate=true;line.geometry.computeBoundingSphere();
      });
    }
    const sampleCount=12, familyU=48, familyR=16, verticesPerFace=(familyU+1)*(familyR+1);
    const maxVertices=(sampleCount+1)*verticesPerFace;
    const familyGeometry=new T.BufferGeometry();
    familyGeometry.setAttribute('position',new T.BufferAttribute(new Float32Array(maxVertices*3),3));
    familyGeometry.setAttribute('color',new T.BufferAttribute(new Float32Array(maxVertices*3),3));
    const familyMaterial=new T.MeshBasicMaterial({color:0xffffff,vertexColors:true,side:T.DoubleSide,transparent:true,opacity:state.opacity,depthWrite:false,forceSinglePass:true});
    const familyMesh=new T.Mesh(familyGeometry,familyMaterial);familyMesh.frustumCulled=false;scene.add(familyMesh);
    let triangleVertices=[],triangleOrder=[],triangleDepths=[];
    function phaseColor(theta){const f=Math.max(0,theta/TAU);return new T.Color().setHSL(.78*(f<=1?f:f%1),1,.5);}
    function sampledPoint(theta,u,r){
      if(state.model==='local')return localPoint(fixedX+arcHalfWidth*(2*u-1),collarWidth*r,theta);
      const p=patch(A*u,r),cell=Math.floor((fixedX-theta/3)/A);p[0]+=cell*A;
      return world(screw(p,theta));
    }
    function updateFamily(){
      const phases=[];
      for(let i=0;i<sampleCount;i++){
        const t=TAU*i/sampleCount,d=Math.abs(t-state.theta)%TAU;
        // Avoid drawing identical pages twice at the selected phase and at 2π.
        if(Math.min(d,TAU-d)>.002)phases.push(t);
      }
      phases.push(state.theta);
      const pos=familyGeometry.attributes.position,col=familyGeometry.attributes.color;
      triangleVertices=[];
      phases.forEach((theta,k)=>{
        const color=phaseColor(theta),offset=k*verticesPerFace;
        for(let i=0;i<=familyU;i++)for(let j=0;j<=familyR;j++){
          const index=offset+i*(familyR+1)+j;
          pos.setXYZ(index,...sampledPoint(theta,i/familyU,j/familyR));col.setXYZ(index,color.r,color.g,color.b);
        }
        for(let i=0;i<familyU;i++)for(let j=0;j<familyR;j++){
          const v=offset+i*(familyR+1)+j;
          triangleVertices.push(v,v+1,v+familyR+1,v+1,v+familyR+2,v+familyR+1);
        }
      });
      pos.needsUpdate=true;col.needsUpdate=true;
      familyGeometry.setIndex(triangleVertices);
      triangleOrder=Array.from({length:triangleVertices.length/3},(_,i)=>i);
      triangleDepths=new Float32Array(triangleOrder.length);
    }
    function sortFamily(){
      if(!familyMesh.visible)return;
      camera.updateMatrixWorld();
      const m=camera.matrixWorldInverse.elements,p=familyGeometry.attributes.position.array;
      for(let t=0;t<triangleOrder.length;t++){
        let z=0;
        for(let j=0;j<3;j++){const k=triangleVertices[t*3+j]*3;z+=m[2]*p[k]+m[6]*p[k+1]+m[10]*p[k+2]+m[14];}
        triangleDepths[t]=z/3;
      }
      // Sort triangles across ALL pages, not just each mesh's center.
      triangleOrder.sort((a,b)=>triangleDepths[a]-triangleDepths[b]);
      const a=familyGeometry.index.array;
      triangleOrder.forEach((t,i)=>{a[3*i]=triangleVertices[3*t];a[3*i+1]=triangleVertices[3*t+1];a[3*i+2]=triangleVertices[3*t+2];});
      familyGeometry.index.needsUpdate=true;
    }
    function clearGroup(group){while(group.children.length){const child=group.children[0];child.geometry.dispose();group.remove(child);}}
    function buildFixed(){
      clearGroup(fixed);
      // The two lifted strands over x in [0,2π]; at λ=1 their ends meet and close the trefoil.
      for(const sign of [-1,1]){
        const pts=Array.from({length:401},(_,i)=>{const x=TAU*i/400;return world([x,sign*Math.sin(1.5*x),sign*Math.cos(1.5*x)]);});
        fixed.add(curveTube(pts,.045,knotMat,500));
      }
      builtFold=state.fold;fixed.visible=state.knot;
    }
    function piLabel(value){const table=[[0,'0'],[PI/2,'π/2'],[PI/3,'π/3'],[TAU/3,'2π/3']];for(let n=1;n<=12;n++)table.push([n*PI,(n===1?'':n)+'π']);for(const [v,label] of table)if(Math.abs(value-v)<.004)return label;return (value/PI).toFixed(2)+'π';}
    function update(){
      currentCell=Math.floor((fixedX-state.theta/3)/A);
      if(state.fold!==builtFold)buildFixed();
      $('#gt-fold').value=state.fold;$('#gt-fold-value').textContent=state.fold.toFixed(2);
      // The sheet travels continuously along K under the screw motion. Each primitive
      // (triangle or rule segment) is wrapped back into the fundamental domain x in [0,2π)
      // by the deck transformation x -> x-2π, so what leaves at the right re-enters at the left
      // and the pieces rejoin seamlessly on the closed torus.
      for(const {object,base} of tracked){
        const attr=object.geometry.attributes.position,arr=attr.array,g=object.userData.group||1;
        for(let k=0;k<base.length;k+=3*g){
          const pts=[];let mx=0;
          for(let j=0;j<g;j++){const p=screw([base[k+3*j],base[k+3*j+1],base[k+3*j+2]],state.theta);pts.push(p);mx+=p[0];}
          const shift=Math.floor(mx/g/TAU)*TAU;
          for(let j=0;j<g;j++){const p=world([pts[j][0]-shift,pts[j][1],pts[j][2]]);arr[k+3*j]=p[0];arr[k+3*j+1]=p[1];arr[k+3*j+2]=p[2];}
        }
        attr.needsUpdate=true;object.geometry.computeBoundingSphere();
        if(object.isMesh)object.geometry.computeVertexNormals();
      }
      const local=state.model==='local';
      moving.visible=!local;rules.visible=!local&&state.rules;fixed.visible=state.knot;
      for(const m of sheets)m.visible=state.fill&&!state.family&&m.userData.cell<state.count;for(const l of rules.children)l.visible=l.userData.cell<state.count;sheetMat.opacity=state.opacity;sheetMat.depthWrite=state.opacity>.5;for(const m of ruleMats)m.opacity=Math.min(.8,.3+state.opacity*.5);
      light.castShadow=state.shadow;ground.visible=state.shadow;
      const diskAlpha=(state.disks&&!local&&!state.family&&state.count===3)?Math.max(0,Math.min(1,(state.fold-.97)/.03)):0;
      for(const [d,ring,off] of [[diskA,ringA,0],[diskB,ringB,PI]]){
        d.visible=ring.visible=diskAlpha>0;
        if(d.visible){updateDisk(d,ring,state.theta/2+off);d.material.opacity=.55*diskAlpha;ring.material.opacity=diskAlpha;}
      }
      collar.visible=local&&state.fill&&!state.family;collarRules.visible=local&&state.rules;
      familyMesh.visible=state.family&&state.fill;
      fillMat.color.copy(phaseColor(state.theta));ruleMat.color.copy(phaseColor(state.theta));
      fillMat.opacity=state.opacity;fillMat.depthWrite=state.opacity>.5;familyMaterial.opacity=Math.min(.3,state.opacity);
      ruleMat.opacity=Math.min(.55,state.opacity*2.5);
      if(familyMesh.visible)updateFamily();
      if(local)updateCollar();
      updateVector();
      $('#gt-value').textContent=piLabel(state.theta);
      $('#gt-motion').textContent=local?'局部纤维相位 '+piLabel(state.theta):'平移 '+piLabel(state.theta/3)+' · 转角 '+piLabel(state.theta/2);
      $('#gt-title').textContent=local?'结附近的局部纤维':(state.count===3?'原始 Gθ · 三个直纹片 · 彩虹细条':'原始 Gθ · 一个直纹片 · 彩虹细条');
      if(state.family)$('#gt-title').textContent=local?'局部纤维 · 彩虹叠加':'原始 Gθ · 彩虹叠加';
      $('#gt-caption').textContent=local?'管状邻域内 · 粉点固定 · 内向单位切向量':(state.count===3?'三个直纹片 · 各 23 个细条 · 随 θ 沿结平移并回卷 · 闭合时红边拼成一圈、紫边拼成一圈，各接一个圆盘（无限大的一侧渐隐）':'一个直纹片 · 23 个细条各一色 · 随 θ 沿结平移，出右端从左端回来');
      const sheetLegend=!local&&!state.family;$('#gt-spec-lo').textContent=sheetLegend?'条 1':'θ：0';$('#gt-spec-hi').textContent=sheetLegend?'条 23':'2π';
      if(state.family)$('#gt-caption').textContent+=' · 12 个相位 + 当前 θ';
      $('#gt-opacity-value').textContent=Math.round(state.opacity*100)+'%';
      dirty=true;
    }
    function cameraUpdate(){
      const l=state.fold,center=new T.Vector3(PI*(1-l),0,0);
      const aspect=camera.aspect,dist=(CAM.cover.dist+(CAM.torus.dist-CAM.cover.dist)*l)*zoom*Math.max(1,.95/aspect);
      camera.position.set(center.x+dist*Math.cos(elevation)*Math.cos(yaw),center.y+dist*Math.cos(elevation)*Math.sin(yaw),center.z+dist*Math.sin(elevation));
      camera.lookAt(center);dirty=true;
    }
    function save(){
      if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{theta:state.theta,thetaOverPi:state.theta/PI,view:state.view,model:state.model,family:state.family,surfaceOpacity:state.opacity,fixedPointX:fixedX,tangentVector:state.model==='local'?currentVector:null,patch:state.model==='local'?'smooth tubular local page; not a global Rolfsen reconstruction':'three raw ruled patches (rainbow strips) travelling along K; at fold=1 their red/violet edges bound two Rolfsen disks'},privateContent:{...state,yaw,elevation,zoom}}).catch(()=>{});
    }
    function stop(){playing=false;}
    function apply(saved){
      const s=saved?.privateContent;if(!s)return;
      if(Number.isFinite(s.theta))state.theta=Math.max(0,Math.min(THETA_MAX,s.theta));
      if(s.view==='torus'||s.view==='cover'){state.view=s.view;state.fold=state.view==='torus'?1:0;}
      if(s.count===1||s.count===3)state.count=s.count;
      if(Number.isFinite(s.fold))state.fold=Math.max(0,Math.min(1,s.fold));foldAnim=null;
      if(s.model==='raw'||s.model==='local')state.model=s.model;
      for(const key of ['fill','rules','knot','family','shadow','disks'])if(typeof s[key]==='boolean')state[key]=s[key];
      if(Number.isFinite(s.opacity))state.opacity=Math.max(.03,Math.min(1,s.opacity));
      if(Number.isFinite(s.yaw))yaw=s.yaw;
      if(Number.isFinite(s.elevation))elevation=Math.max(-1.4,Math.min(1.4,s.elevation));
      if(Number.isFinite(s.zoom))zoom=Math.max(.6,Math.min(2,s.zoom));
      $('#gt-view').value=state.view+'-'+state.count;$('#gt-model').value=state.model;$('#gt-opacity').value=state.opacity;for(const key of ['fill','rules','knot','family','shadow','disks'])$('#gt-'+key).checked=state[key];
      stop();buildFixed();update();cameraUpdate();
    }
    $('#gt-play').addEventListener('click',()=>{if(playing)return;playing=true;last=performance.now();$('#gt-status').textContent='播放中，0 → 12π 循环';});
    $('#gt-pause').addEventListener('click',()=>{stop();save();$('#gt-status').textContent='已暂停：θ = '+piLabel(state.theta);});
    $('#gt-reset').addEventListener('click',()=>{stop();state.theta=0;update();save();$('#gt-status').textContent='已重置：θ = 0';});
    $('#gt-view').addEventListener('change',()=>{const [v,c]=$('#gt-view').value.split('-');state.view=v;state.count=Number(c);const to=v==='torus'?1:0;
      if(Math.abs(state.fold-to)>1e-6){zoom=1;foldAnim={from:state.fold,to,start:performance.now(),duration:3000};}else{update();save();}});
    $('#gt-fold').addEventListener('input',()=>{foldAnim=null;state.fold=Number($('#gt-fold').value);state.view=state.fold>=.5?'torus':'cover';$('#gt-view').value=state.view+'-'+state.count;update();cameraUpdate();});
    $('#gt-fold').addEventListener('change',save);
    root.gtSet={theta:v=>{stop();state.theta=Math.max(0,Math.min(THETA_MAX,Number(v)||0));update();save();},fold:v=>{foldAnim=null;state.fold=Math.max(0,Math.min(1,Number(v)||0));state.view=state.fold>=.5?'torus':'cover';$('#gt-view').value=state.view+'-'+state.count;update();cameraUpdate();}};
    $('#gt-model').addEventListener('change',()=>{state.model=$('#gt-model').value;update();save();});
    for(const key of ['fill','rules','knot','family','shadow','disks'])$('#gt-'+key).addEventListener('change',()=>{state[key]=$('#gt-'+key).checked;update();save();});
    $('#gt-opacity').addEventListener('input',()=>{state.opacity=Number($('#gt-opacity').value);update();});
    $('#gt-opacity').addEventListener('change',save);
    let drag=null;
    canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});
    canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-drag.x)*.008;elevation=Math.max(-1.4,Math.min(1.4,elevation+(e.clientY-drag.y)*.008));drag={x:e.clientX,y:e.clientY};cameraUpdate();});
    canvas.addEventListener('pointerup',()=>{drag=null;save();});canvas.addEventListener('pointercancel',()=>{drag=null;});
    canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.6,Math.min(2,zoom*Math.exp(e.deltaY*.001)));cameraUpdate();save();},{passive:false});
    const observer=new ResizeObserver(()=>{const w=canvas.parentElement.clientWidth,h=canvas.parentElement.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();cameraUpdate();});observer.observe(canvas.parentElement);
    window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)apply(event.detail.globals.widgetState);});
    $('#gt-view').value=state.view+'-'+state.count;$('#gt-model').value=state.model;$('#gt-opacity').value=state.opacity;for(const key of ['fill','rules','knot','family','shadow','disks'])$('#gt-'+key).checked=state[key];buildFixed();update();apply(window.openai?.widgetState);cameraUpdate();
    function animate(now){
      if(!root.isConnected){observer.disconnect();renderer.dispose();return;}
      requestAnimationFrame(animate);
      if(playing){const dt=Math.min((now-last)/1000,.08);last=now;state.theta+=dt*TAU/3;if(state.theta>=THETA_MAX)state.theta-=THETA_MAX;update();}
      if(foldAnim){
        const t=Math.min(1,(now-foldAnim.start)/foldAnim.duration),e=t*t*(3-2*t);
        state.fold=foldAnim.from+(foldAnim.to-foldAnim.from)*e;
        const k=state.fold;yaw=CAM.cover.yaw+(CAM.torus.yaw-CAM.cover.yaw)*k;elevation=CAM.cover.elevation+(CAM.torus.elevation-CAM.cover.elevation)*k;
        if(t>=1){state.fold=foldAnim.to;foldAnim=null;save();}
        update();cameraUpdate();
      }
      if(dirty){sortFamily();renderer.render(scene,camera);dirty=false;}
    }
    requestAnimationFrame(animate);
  } catch(error){$('#gt-error').hidden=false;$('#gt-error').textContent=error.message;}
})();
</script>
<script>
(()=>{const p=new URLSearchParams(location.search),root=document.getElementById('gtheta-viz');
const set=(id,v,ev)=>{const e=document.getElementById(id);if(!e||v==null)return;if(e.type==='checkbox')e.checked=v!=='0';else e.value=v;e.dispatchEvent(new Event(ev||'input'));};
set('gt-model',p.get('model'),'change');if(p.get('count')!=null){const v=document.getElementById('gt-view');v.value=(p.get('fold')==='1'?'torus':'cover')+'-'+p.get('count');v.dispatchEvent(new Event('change'));}set('gt-opacity',p.get('opacity'));
for(const k of ['fill','rules','knot','family','shadow','disks'])set('gt-'+k,p.get(k),'change');
if(p.get('fold')!=null)root.gtSet.fold(p.get('fold'));if(p.get('theta')!=null)root.gtSet.theta(p.get('theta'));
if(p.get('yaw')!=null||p.get('elev')!=null){/* camera is adjusted by dragging; no param */}
})();
</script>
</body>
